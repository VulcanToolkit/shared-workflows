---
name: 🔎 Vulcan Review
description: Review PR and commit code for consistency

on:
    workflow_call:
        inputs:
            additional_context:
                type: string
                description: Any additional context from the request
                required: false
            requested_pr_review:
                type: string
                description: Whether a pull request review was requested ('true' or 'false')
                required: false
                default: 'true'
            requested_commit_review:
                type: string
                description: Whether a commit review was requested ('true' or 'false')
                required: false
                default: 'false'
        secrets:
            gemini-api-key:
                required: true

concurrency:
    group: ${{ github.workflow }}-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}
    cancel-in-progress: true

defaults:
    run:
        shell: bash

jobs:
    start-review:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            pull-requests: read
        outputs:
            commits: ${{ steps.get-pr-commits.outputs.commits }}
            commit-hashes: ${{ steps.get-pr-commits.outputs.commit-hashes }}
        steps:
            - name: Get PR Commits
              id: get-pr-commits
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # ratchet:actions/github-script@v9
              with:
                  github-token: ${{ github.token }}
                  result-encoding: string
                  script: |
                      const commits = await github.rest.pulls.listCommits({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        pull_number: context.payload.pull_request ? context.payload.pull_request.number : context.payload.issue.number,
                      });

                      // List of hashes for the matrix strategy
                      core.setOutput("commit-hashes", JSON.stringify(commits.data.map(x => x.sha)))

                      // Map of hash to commit information for reporting
                      const commit_map = Object.fromEntries(commits.data.map(x => [x.sha, x]));
                      core.setOutput("commits", JSON.stringify(commit_map))

    pr-review:
        needs: start-review
        runs-on: ubuntu-latest
        timeout-minutes: 30
        if: ${{ inputs.requested_pr_review == 'true' }}
        permissions:
            contents: read
        strategy:
            matrix:
                repetition: [1, 2, 3, 4, 5]
        steps:
            # This will checkout the base repository default branch, not the PR code.
            # It is to be used for context during the code review.
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

            - name: Write context file
              shell: bash
              run: |
                  echo "Repository: ${{ github.repository }}" >vulcan-context.md
                  echo "Repository owner: ${{ github.repository_owner }}" >>vulcan-context.md
                  echo "Repository name: ${{ github.event.repository.name }}" >>vulcan-context.md
                  echo "Additional context: ${{ inputs.additional_context }}" >>vulcan-context.md
                  cat vulcan-context.md

            - name: Run Vulcan pull request review
              id: vulcan-pr-review
              uses: google-github-actions/run-gemini-cli@9dbec29a20fab3f35017a40ad0eb798a257d4d51 # ratchet:google-github-actions/run-gemini-cli@v0.1.21
              env:
                  GEMINI_API_KEY: ${{ secrets.gemini-api-key }}
                  GITHUB_TOKEN: ${{ github.token }}
              with:
                  gcp_location: ${{ vars.GOOGLE_CLOUD_LOCATION }}
                  gcp_project_id: ${{ vars.GOOGLE_CLOUD_PROJECT }}
                  gcp_service_account: ${{ vars.SERVICE_ACCOUNT_EMAIL }}
                  gcp_workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
                  gemini_api_key: ${{ secrets.gemini-api-key }}
                  gemini_cli_version: ${{ vars.GEMINI_CLI_VERSION || '0.38.1' }}
                  gemini_debug: ${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}
                  gemini_model: ${{ vars.GEMINI_MODEL }}
                  google_api_key: ${{ secrets.GOOGLE_API_KEY }}
                  use_gemini_code_assist: ${{ vars.GOOGLE_GENAI_USE_GCA }}
                  use_vertex_ai: ${{ vars.GOOGLE_GENAI_USE_VERTEXAI }}
                  upload_artifacts: ${{ vars.UPLOAD_ARTIFACTS }}
                  workflow_name: gemini-review
                  settings: |-
                      {
                        "model": {
                          "maxSessionTurns": 50
                        },
                        "telemetry": {
                          "enabled": true,
                          "target": "local",
                          "outfile": ".gemini/telemetry.log"
                        },
                        "mcpServers": {
                          "github": {
                            "command": "docker",
                            "args": [
                              "run",
                              "-i",
                              "--rm",
                              "-e",
                              "GITHUB_PERSONAL_ACCESS_TOKEN",
                              "-e",
                              "GITHUB_READ_ONLY=1",
                              "-e",
                              "GITHUB_TOOLS",
                              "ghcr.io/github/github-mcp-server:v2.0.3"
                            ],
                            "includeTools": [
                              "pull_request_read"
                            ],
                            "env": {
                              "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}",
                              "GITHUB_TOOLS": "pull_request_read"
                            }
                          }
                        },
                        "output": {
                          "format": "json"
                        },
                        "tools": {
                          "core": [
                            "run_shell_command(cat)",
                            "run_shell_command(echo)",
                            "run_shell_command(grep)",
                            "run_shell_command(head)",
                            "run_shell_command(tail)"
                          ]
                        }
                      }
                  extensions: |
                      [
                        "https://github.com/VulcanToolkit/gemini-extension"
                      ]
                  prompt: /vulcan-review-pr ${{ github.event.pull_request.number || github.event.issue.number }}

            - name: Save output
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # ratchet:actions/github-script@v9
              id: save-outputs
              env:
                  GEMINI_OUTPUT: ${{ steps.vulcan-pr-review.outputs.summary }}
                  REPETITION: ${{ matrix.repetition }}
              with:
                  script: |
                      const fs = require('fs');
                      const content = process.env.GEMINI_OUTPUT;
                      fs.writeFileSync(`vulcan-pr-${process.env.REPETITION}.txt`, content);

            - name: Create review artifacts
              id: upload-artifact
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7
              with:
                  name: vulcan-pr-${{ matrix.repetition }}
                  path: vulcan-pr-${{ matrix.repetition }}.txt

            - name: Post to report-generation service
              env:
                  REPO_OWNER: ${{ github.repository_owner }}
                  REPO_NAME: ${{ github.event.repository.name }}
                  PULL_NUM: ${{ github.event.pull_request.number || github.event.issue.number }}
                  RUN_ID: ${{ github.run_id }}
                  ARTIFACT_ID: ${{ steps.upload-artifact.outputs.artifact-id }}
              run: |
                  args="repo_owner=$REPO_OWNER&repo_name=$REPO_NAME&pull_num=$PULL_NUM&run_id=$RUN_ID&artifact_id=$ARTIFACT_ID"
                  curl -X POST "https://us-central1-sinclair-nsfsafeose25-57a9.cloudfunctions.net/load_artifact?$args"

    finish-pr-review:
        needs: [start-review, pr-review]
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            pull-requests: write
        outputs:
            should-review-commits: ${{ steps.fetch-pr-report.outputs.should-review-commits }}
        steps:
            - name: Fetch PR review report
              id: fetch-pr-report
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  PULL_NUM: ${{ github.event.pull_request.number || github.event.issue.number }}
                  REPO_OWNER: ${{ github.repository_owner }}
                  REPO_NAME: ${{ github.event.repository.name }}
                  RUN_ID: ${{ github.run_id }}
              run: |
                  args="repo_owner=$REPO_OWNER&repo_name=$REPO_NAME&pull_num=$PULL_NUM&run_id=$RUN_ID"
                  report=$(curl "https://us-central1-sinclair-nsfsafeose25-57a9.cloudfunctions.net/make_pr_report?$args")
                  gh issue comment "$PULL_NUM" --repo "$REPOSITORY" --body "$report"

                  if [[ "$report" == *"A review of the individual commits will be conducted."* ]]; then
                    echo "should-review-commits=true" >>$GITHUB_OUTPUT
                  else
                    echo "should-review-commits=false" >>$GITHUB_OUTPUT
                  fi

    commit-review:
        needs: [start-review, finish-pr-review]
        if: |
            always() && (inputs.requested_commit_review == 'true' || needs.finish-pr-review.outputs.should-review-commits == 'true')
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
        strategy:
            matrix:
                commit: ${{ fromJson(needs.start-review.outputs.commit-hashes) }}
                repetition: [1, 2, 3, 4, 5]
        steps:
            # This will checkout the base repository default branch, not the PR code.
            # It is to be used for context during the code review.
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

            - name: Write context file
              shell: bash
              run: |
                  echo "Repository: ${{ github.repository }}" >vulcan-context.md
                  echo "Repository owner: ${{ github.repository_owner }}" >>vulcan-context.md
                  echo "Repository name: ${{ github.event.repository.name }}" >>vulcan-context.md
                  echo "Additional context: ${{ inputs.additional_context }}" >>vulcan-context.md
                  cat vulcan-context.md

            - name: Run Vulcan commit review
              id: vulcan-commit-review
              uses: google-github-actions/run-gemini-cli@9dbec29a20fab3f35017a40ad0eb798a257d4d51 # ratchet:google-github-actions/run-gemini-cli@v0.1.21
              env:
                  GEMINI_API_KEY: ${{ secrets.gemini-api-key }}
                  GITHUB_TOKEN: ${{ github.token }}
              with:
                  gcp_location: ${{ vars.GOOGLE_CLOUD_LOCATION }}
                  gcp_project_id: ${{ vars.GOOGLE_CLOUD_PROJECT }}
                  gcp_service_account: ${{ vars.SERVICE_ACCOUNT_EMAIL }}
                  gcp_workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
                  gemini_api_key: ${{ secrets.gemini-api-key }}
                  gemini_cli_version: ${{ vars.GEMINI_CLI_VERSION || '0.38.1' }}
                  gemini_debug: ${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}
                  gemini_model: ${{ vars.GEMINI_MODEL }}
                  google_api_key: ${{ secrets.GOOGLE_API_KEY }}
                  use_gemini_code_assist: ${{ vars.GOOGLE_GENAI_USE_GCA }}
                  use_vertex_ai: ${{ vars.GOOGLE_GENAI_USE_VERTEXAI }}
                  upload_artifacts: ${{ vars.UPLOAD_ARTIFACTS }}
                  workflow_name: gemini-review
                  settings: |-
                      {
                        "model": {
                          "maxSessionTurns": 50
                        },
                        "telemetry": {
                          "enabled": true,
                          "target": "local",
                          "outfile": ".gemini/telemetry.log"
                        },
                        "mcpServers": {
                          "github": {
                            "command": "docker",
                            "args": [
                              "run",
                              "-i",
                              "--rm",
                              "-e",
                              "GITHUB_PERSONAL_ACCESS_TOKEN",
                              "-e",
                              "GITHUB_READ_ONLY=1",
                              "-e",
                              "GITHUB_TOOLS",
                              "ghcr.io/github/github-mcp-server:v2.0.3"
                            ],
                            "includeTools": [
                              "get_commit"
                            ],
                            "env": {
                              "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}",
                              "GITHUB_TOOLS": "get_commit"
                            }
                          }
                        },
                        "output": {
                          "format": "json"
                        },
                        "tools": {
                          "core": [
                            "run_shell_command(cat)",
                            "run_shell_command(echo)",
                            "run_shell_command(grep)",
                            "run_shell_command(head)",
                            "run_shell_command(tail)"
                          ]
                        }
                      }
                  extensions: |
                      [
                        "https://github.com/VulcanToolkit/gemini-extension"
                      ]
                  prompt: /vulcan-review-commit ${{ matrix.commit }}

            - name: Save output
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # ratchet:actions/github-script@v9
              id: save-outputs
              env:
                  COMMIT_SHA: ${{ matrix.commit }}
                  GEMINI_OUTPUT: ${{ steps.vulcan-commit-review.outputs.summary }}
                  REPETITION: ${{ matrix.repetition }}
              with:
                  script: |
                      const fs = require('fs');
                      const content = process.env.GEMINI_OUTPUT;
                      fs.writeFileSync(`vulcan-commit-${process.env.COMMIT_SHA}-${process.env.REPETITION}.txt`, content);

            - name: Create review artifacts
              id: upload-artifact
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7
              with:
                  name: vulcan-commit-${{ matrix.commit }}-${{ matrix.repetition }}
                  path: vulcan-commit-${{ matrix.commit }}-${{ matrix.repetition }}.txt

            - name: Post to report-generation service
              env:
                  REPO_OWNER: ${{ github.repository_owner }}
                  REPO_NAME: ${{ github.event.repository.name }}
                  PULL_NUM: ${{ github.event.pull_request.number || github.event.issue.number }}
                  RUN_ID: ${{ github.run_id }}
                  ARTIFACT_ID: ${{ steps.upload-artifact.outputs.artifact-id }}
              run: |
                  args="repo_owner=$REPO_OWNER&repo_name=$REPO_NAME&pull_num=$PULL_NUM&run_id=$RUN_ID&artifact_id=$ARTIFACT_ID"
                  curl -X POST "https://us-central1-sinclair-nsfsafeose25-57a9.cloudfunctions.net/load_artifact?$args"

    finish-commit-review:
        needs: [start-review, commit-review]
        if: |
            always() && (inputs.requested_commit_review == 'true' || needs.finish-pr-review.outputs.should-review-commits == 'true')
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            pull-requests: write
        steps:
            - name: Fetch commit review report
              id: fetch-commit-report
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  PULL_NUM: ${{ github.event.pull_request.number || github.event.issue.number }}
                  REPO_OWNER: ${{ github.repository_owner }}
                  REPO_NAME: ${{ github.event.repository.name }}
                  RUN_ID: ${{ github.run_id }}
              run: |
                  args="repo_owner=$REPO_OWNER&repo_name=$REPO_NAME&pull_num=$PULL_NUM&run_id=$RUN_ID"
                  report=$(curl "https://us-central1-sinclair-nsfsafeose25-57a9.cloudfunctions.net/make_commit_report?$args")
                  gh issue comment "$PULL_NUM" --repo "$REPOSITORY" --body "$report"
