---
name: 🔎 Vulcan Review
description: Review PR and commit code for consistency

on:
    workflow_call:
        inputs:
            additional_context:
                type: string
                description: Any additional context from the request
                required: false
            gemini_cli_version:
                type: string
                description: Version of the Gemini CLI to install
                required: false
                default: 0.38.1
            google_cloud_location:
                type: string
                description: Google Cloud location
                required: false
                default: us-central1
            google_cloud_project:
                type: string
                description: Google Cloud project ID
                required: false
                default: sinclair-nsfsafeose25-57a9
            requested_pr_review:
                type: string
                description: Whether a pull request review was requested ('true' or 'false')
                required: false
                default: 'true'
            requested_commit_review:
                type: string
                description: Whether a commit review was requested ('true' or 'false')
                required: false
                default: 'false'
        secrets:
            google-api-key:
                required: true

concurrency:
    group: ${{ github.workflow }}-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}
    cancel-in-progress: true

defaults:
    run:
        shell: bash

jobs:
    start-review:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            pull-requests: read
        outputs:
            commits: ${{ steps.get-pr-commits.outputs.commits }}
            commit-hashes: ${{ steps.get-pr-commits.outputs.commit-hashes }}
        steps:
            - name: Get PR Commits
              id: get-pr-commits
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # ratchet:actions/github-script@v9
              with:
                  github-token: ${{ github.token }}
                  result-encoding: string
                  script: |
                      const params = {
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          pull_number: context.payload.pull_request ? context.payload.pull_request.number : context.payload.issue.number,
                      };

                      // We are intentionally not handling pagination here to
                      // limit the maximum number of reviewed commits.
                      // This is necessary to avoid exceeding the 256 limit
                      // on matrix strategy tasks (50 commits x 5 repetitions).
                      // The generated report will alert the user to this limitation.
                      const { data: commits } = await github.rest.pulls.listCommits({ ...params, per_page: 50 });

                      // List of hashes for the matrix strategy
                      core.setOutput("commit-hashes", JSON.stringify(commits.map(x => x.sha)))

                      // Map of hash to commit information for reporting
                      const commit_map = Object.fromEntries(commits.map(x => [x.sha, x]));
                      core.setOutput("commits", JSON.stringify(commit_map))

    pr-review:
        needs: start-review
        runs-on: ubuntu-latest
        timeout-minutes: 30
        if: inputs.requested_pr_review == 'true'
        permissions:
            contents: read
            pull-requests: read
        strategy:
            matrix:
                repetition: [1, 2, 3, 4, 5]
        steps:
            # This will checkout the base repository default branch, not the PR code.
            # It is to be used for context during the code review.
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

            - name: Write context file
              shell: bash
              env:
                  ADDITIONAL_CONTEXT: ${{ inputs.additional_context }}
                  REPO_NAME: ${{ github.event.repository.name }}
                  REPO_OWNER: ${{ github.repository_owner }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  {
                      printf 'Repository: %s\n' "$REPOSITORY"
                      printf 'Repository owner: %s\n' "$REPO_OWNER"
                      printf 'Repository name: %s\n' "$REPO_NAME"
                  } > vulcan-context.md
                  if [ -n "$ADDITIONAL_CONTEXT" ]; then
                      printf 'Additional context: %s\n' "$ADDITIONAL_CONTEXT" >>vulcan-context.md
                  fi

            - name: Install Vulcan Gemini extension
              env:
                  GEMINI_CLI_VERSION: ${{ inputs.gemini_cli_version }}
                  VULCAN_EXTENSION_SHA: aa23ce25d03c0195c6adb16d50044ab31a7b9a88
              run: |
                  npm install --global "@google/gemini-cli@$GEMINI_CLI_VERSION"
                  gemini extensions install \
                      https://github.com/VulcanToolkit/gemini-extension \
                      --ref "$VULCAN_EXTENSION_SHA" --consent --skip-settings

            - name: Run Vulcan pull request review
              id: vulcan-pr-review
              uses: google-github-actions/run-gemini-cli@9dbec29a20fab3f35017a40ad0eb798a257d4d51 # ratchet:google-github-actions/run-gemini-cli@v0.1.21
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              with:
                  gcp_location: ${{ inputs.google_cloud_location }}
                  gcp_project_id: ${{ inputs.google_cloud_project }}
                  gemini_cli_version: ${{ inputs.gemini_cli_version }}
                  gemini_debug: ${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}
                  gemini_model: ${{ vars.GEMINI_MODEL }}
                  google_api_key: ${{ secrets.google-api-key }}
                  use_vertex_ai: true
                  upload_artifacts: ${{ vars.UPLOAD_ARTIFACTS }}
                  # ghcr.io/github/github-mcp-server@sha256:250bc6ce70788207608ef74cef4397230ff2e8481218da74d6093e4bd9101132 = v2.0.3
                  settings: |-
                      {
                        "model": {
                          "maxSessionTurns": 50
                        },
                        "telemetry": {
                          "enabled": true,
                          "target": "local",
                          "outfile": ".gemini/telemetry.log"
                        },
                        "mcpServers": {
                          "github": {
                            "command": "docker",
                            "args": [
                              "run",
                              "-i",
                              "--rm",
                              "-e",
                              "GITHUB_PERSONAL_ACCESS_TOKEN",
                              "-e",
                              "GITHUB_READ_ONLY=1",
                              "-e",
                              "GITHUB_TOOLS",
                              "ghcr.io/github/github-mcp-server@sha256:250bc6ce70788207608ef74cef4397230ff2e8481218da74d6093e4bd9101132"
                            ],
                            "includeTools": [
                              "pull_request_read"
                            ],
                            "env": {
                              "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}",
                              "GITHUB_TOOLS": "pull_request_read"
                            }
                          }
                        },
                        "output": {
                          "format": "json"
                        },
                        "tools": {
                          "core": [
                            "activate_skill",
                            "glob",
                            "grep_search",
                            "list_directory",
                            "read_file"
                          ]
                        }
                      }
                  extensions: '[]'
                  prompt: /vulcan-review-pr ${{ github.event.pull_request.number || github.event.issue.number }}

            - name: Save output
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # ratchet:actions/github-script@v9
              id: save-outputs
              env:
                  GEMINI_OUTPUT: ${{ steps.vulcan-pr-review.outputs.summary }}
                  REPETITION: ${{ matrix.repetition }}
              with:
                  script: |
                      const fs = require('fs');
                      const content = process.env.GEMINI_OUTPUT;
                      fs.writeFileSync(`vulcan-pr-${process.env.REPETITION}.txt`, content);

            - name: Create review artifacts
              id: upload-artifact
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7
              with:
                  name: vulcan-pr-${{ matrix.repetition }}
                  path: vulcan-pr-${{ matrix.repetition }}.txt

            - name: Post to report-generation service
              env:
                  ARTIFACT_ID: ${{ steps.upload-artifact.outputs.artifact-id }}
                  GCP_LOCATION: ${{ inputs.google_cloud_location }}
                  GCP_PROJECT_ID: ${{ inputs.google_cloud_project }}
                  PULL_NUM: ${{ github.event.pull_request.number || github.event.issue.number }}
                  REPO_NAME: ${{ github.event.repository.name }}
                  REPO_OWNER: ${{ github.repository_owner }}
                  RUN_ID: ${{ github.run_id }}
              run: |
                  args="repo_owner=$REPO_OWNER&repo_name=$REPO_NAME&pull_num=$PULL_NUM&run_id=$RUN_ID&artifact_id=$ARTIFACT_ID"
                  curl -X POST "https://$GCP_LOCATION-$GCP_PROJECT_ID.cloudfunctions.net/load_artifact?$args"

    finish-pr-review:
        needs: [start-review, pr-review]
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            pull-requests: write
        outputs:
            should-review-commits: ${{ steps.fetch-pr-report.outputs.should-review-commits }}
        steps:
            - name: Fetch PR review report
              id: fetch-pr-report
              env:
                  GCP_LOCATION: ${{ inputs.google_cloud_location }}
                  GCP_PROJECT_ID: ${{ inputs.google_cloud_project }}
                  GITHUB_TOKEN: ${{ github.token }}
                  PULL_NUM: ${{ github.event.pull_request.number || github.event.issue.number }}
                  REPO_NAME: ${{ github.event.repository.name }}
                  REPO_OWNER: ${{ github.repository_owner }}
                  REPOSITORY: ${{ github.repository }}
                  RUN_ID: ${{ github.run_id }}
              run: |
                  args="repo_owner=$REPO_OWNER&repo_name=$REPO_NAME&pull_num=$PULL_NUM&run_id=$RUN_ID"
                  report=$(curl "https://$GCP_LOCATION-$GCP_PROJECT_ID.cloudfunctions.net/make_pr_report?$args")
                  gh issue comment "$PULL_NUM" --repo "$REPOSITORY" --body "$report"

                  if [[ "$report" == *"A review of the individual commits will be conducted."* ]]; then
                    echo "should-review-commits=true" >>$GITHUB_OUTPUT
                  else
                    echo "should-review-commits=false" >>$GITHUB_OUTPUT
                  fi

    commit-review:
        needs: [start-review, finish-pr-review]
        if: >-
            always() && !cancelled() &&
            (inputs.requested_commit_review == 'true' || needs.finish-pr-review.outputs.should-review-commits == 'true')
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
        strategy:
            # Commit review may start up to 250 jobs. Set a limit to avoid
            # exceeding API rate limits.
            max-parallel: 5
            matrix:
                commit: ${{ fromJson(needs.start-review.outputs.commit-hashes) }}
                repetition: [1, 2, 3, 4, 5]
        steps:
            # This will checkout the base repository default branch, not the PR code.
            # It is to be used for context during the code review.
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

            - name: Write context file
              shell: bash
              env:
                  ADDITIONAL_CONTEXT: ${{ inputs.additional_context }}
                  REPO_NAME: ${{ github.event.repository.name }}
                  REPO_OWNER: ${{ github.repository_owner }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  {
                      printf 'Repository: %s\n' "$REPOSITORY"
                      printf 'Repository owner: %s\n' "$REPO_OWNER"
                      printf 'Repository name: %s\n' "$REPO_NAME"
                  } > vulcan-context.md
                  if [ -n "$ADDITIONAL_CONTEXT" ]; then
                      printf 'Additional context: %s\n' "$ADDITIONAL_CONTEXT" >>vulcan-context.md
                  fi

            - name: Install Vulcan Gemini extension
              env:
                  GEMINI_CLI_VERSION: ${{ inputs.gemini_cli_version }}
                  VULCAN_EXTENSION_SHA: aa23ce25d03c0195c6adb16d50044ab31a7b9a88
              run: |
                  npm install --global "@google/gemini-cli@$GEMINI_CLI_VERSION"
                  gemini extensions install \
                      https://github.com/VulcanToolkit/gemini-extension \
                      --ref "$VULCAN_EXTENSION_SHA" --consent --skip-settings

            - name: Run Vulcan commit review
              id: vulcan-commit-review
              uses: google-github-actions/run-gemini-cli@9dbec29a20fab3f35017a40ad0eb798a257d4d51 # ratchet:google-github-actions/run-gemini-cli@v0.1.21
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              with:
                  gcp_location: ${{ inputs.google_cloud_location }}
                  gcp_project_id: ${{ inputs.google_cloud_project }}
                  gemini_cli_version: ${{ inputs.gemini_cli_version }}
                  gemini_debug: ${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}
                  gemini_model: ${{ vars.GEMINI_MODEL }}
                  google_api_key: ${{ secrets.google-api-key }}
                  use_vertex_ai: true
                  upload_artifacts: ${{ vars.UPLOAD_ARTIFACTS }}
                  # ghcr.io/github/github-mcp-server@sha256:250bc6ce70788207608ef74cef4397230ff2e8481218da74d6093e4bd9101132 = v2.0.3
                  settings: |-
                      {
                        "model": {
                          "maxSessionTurns": 50
                        },
                        "telemetry": {
                          "enabled": true,
                          "target": "local",
                          "outfile": ".gemini/telemetry.log"
                        },
                        "mcpServers": {
                          "github": {
                            "command": "docker",
                            "args": [
                              "run",
                              "-i",
                              "--rm",
                              "-e",
                              "GITHUB_PERSONAL_ACCESS_TOKEN",
                              "-e",
                              "GITHUB_READ_ONLY=1",
                              "-e",
                              "GITHUB_TOOLS",
                              "ghcr.io/github/github-mcp-server@sha256:250bc6ce70788207608ef74cef4397230ff2e8481218da74d6093e4bd9101132"
                            ],
                            "includeTools": [
                              "get_commit"
                            ],
                            "env": {
                              "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}",
                              "GITHUB_TOOLS": "get_commit"
                            }
                          }
                        },
                        "output": {
                          "format": "json"
                        },
                        "tools": {
                          "core": [
                            "activate_skill",
                            "glob",
                            "grep_search",
                            "list_directory",
                            "read_file"
                          ]
                        }
                      }
                  extensions: '[]'
                  prompt: /vulcan-review-commit ${{ matrix.commit }}

            - name: Save output
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # ratchet:actions/github-script@v9
              id: save-outputs
              env:
                  COMMIT_SHA: ${{ matrix.commit }}
                  GEMINI_OUTPUT: ${{ steps.vulcan-commit-review.outputs.summary }}
                  REPETITION: ${{ matrix.repetition }}
              with:
                  script: |
                      const fs = require('fs');
                      const content = process.env.GEMINI_OUTPUT;
                      fs.writeFileSync(`vulcan-commit-${process.env.COMMIT_SHA}-${process.env.REPETITION}.txt`, content);

            - name: Create review artifacts
              id: upload-artifact
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7
              with:
                  name: vulcan-commit-${{ matrix.commit }}-${{ matrix.repetition }}
                  path: vulcan-commit-${{ matrix.commit }}-${{ matrix.repetition }}.txt

            - name: Post to report-generation service
              env:
                  ARTIFACT_ID: ${{ steps.upload-artifact.outputs.artifact-id }}
                  GCP_LOCATION: ${{ inputs.google_cloud_location }}
                  GCP_PROJECT_ID: ${{ inputs.google_cloud_project }}
                  PULL_NUM: ${{ github.event.pull_request.number || github.event.issue.number }}
                  REPO_NAME: ${{ github.event.repository.name }}
                  REPO_OWNER: ${{ github.repository_owner }}
                  RUN_ID: ${{ github.run_id }}
              run: |
                  args="repo_owner=$REPO_OWNER&repo_name=$REPO_NAME&pull_num=$PULL_NUM&run_id=$RUN_ID&artifact_id=$ARTIFACT_ID"
                  curl -X POST "https://$GCP_LOCATION-$GCP_PROJECT_ID.cloudfunctions.net/load_artifact?$args"

    finish-commit-review:
        needs: [start-review, finish-pr-review, commit-review]
        if: >-
            always() && !cancelled() &&
            (inputs.requested_commit_review == 'true' || needs.finish-pr-review.outputs.should-review-commits == 'true')
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            pull-requests: write
        steps:
            - name: Fetch commit review report
              id: fetch-commit-report
              env:
                  GCP_LOCATION: ${{ inputs.google_cloud_location }}
                  GCP_PROJECT_ID: ${{ inputs.google_cloud_project }}
                  GITHUB_TOKEN: ${{ github.token }}
                  PULL_NUM: ${{ github.event.pull_request.number || github.event.issue.number }}
                  REPO_NAME: ${{ github.event.repository.name }}
                  REPO_OWNER: ${{ github.repository_owner }}
                  REPOSITORY: ${{ github.repository }}
                  RUN_ID: ${{ github.run_id }}
              run: |
                  args="repo_owner=$REPO_OWNER&repo_name=$REPO_NAME&pull_num=$PULL_NUM&run_id=$RUN_ID"
                  report=$(curl "https://$GCP_LOCATION-$GCP_PROJECT_ID.cloudfunctions.net/make_commit_report?$args")
                  gh issue comment "$PULL_NUM" --repo "$REPOSITORY" --body "$report"
